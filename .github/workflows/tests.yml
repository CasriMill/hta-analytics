name: Run Automated Tests

on:
  push:
    branches: [ "main", "HTA_GUI" ]
  pull_request:
    branches: [ "main", "HTA_GUI" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system GUI & Qt dependencies
      run: |
        sudo apt-get update
        # Používáme libglx-mesa0 a libgl1 místo zastaralého libgl1-mesa-glx
        sudo apt-get install -y xvfb python3-tk libegl1 libgl1 libglx-mesa0 libxrender1 \
          libxext6 libx11-6 libxcb-xinerama0 libxcb-cursor0 libxkbcommon-x11-0 \
          libfontconfig1 libdbus-1-3

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-xvfb
        pip install -e .

    - name: Run pytest validation suite with virtual display
      env:
        QT_QPA_PLATFORM: offscreen
        QT_LOGGING_RULES: "*.debug=false;qt.qpa.gl=false"
      run: |
        xvfb-run --server-args="-screen 0 1024x768x24" pytest -v

