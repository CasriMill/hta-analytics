name: Run Automated Tests

on:
  push:
    branches: [ "main", "HTA_GUI" ]
  pull_request:
    branches: [ "main", "HTA_GUI" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system GUI dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk xvfb

    - name: Install dependencies from pyproject.toml
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-xvfb
        # Automaticky nainstaluje vše definované v pyproject.toml včetně vaší knihovny
        pip install -e .

    - name: Run pytest validation suite with virtual display
      run: |
        xvfb-run pytest

